  * { margin:0; padding:0; box-sizing:border-box; }

  body { background:#0e1013; color:#e9e7e2; overflow:hidden; position:relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; padding:0 110px; }
  .grid { position:absolute; inset:0; background-image:

  .net { position:absolute; right:10px; top:0; width:880px; height:700px; z-index:1; }
  .content { position:relative; z-index:2; }
  .kicker { display:flex; align-items:center; gap:18px; margin-bottom:30px;
    font-family:ui-monospace, "SF Mono", Consolas, monospace;

  .dot { width:14px; height:14px; background:#f2b13f; box-shadow:0 0 16px rgba(242,177,63,.8); }
  h1 { font-weight:900; font-size:126px; line-height:1.0; letter-spacing:-0.015em; }
  h1 .accent { color:#f2b13f; text-shadow:0 0 40px rgba(242,177,63,.35); }
  .sub { margin-top:26px; font-size:29px; line-height:1.45; color:#a6adb8; max-width:960px; }
  .tags { margin-top:34px; display:flex; gap:14px; flex-wrap:wrap; max-width:1000px; }
  .tag { font-family:ui-monospace, "SF Mono", Consolas, monospace; font-size:18px;
    letter-spacing:.12em; text-transform:uppercase; color:#e9e7e2;
    border:1px solid rgba(242,177,63,.55); padding:11px 18px;
    background:rgba(242,177,63,.07); }
