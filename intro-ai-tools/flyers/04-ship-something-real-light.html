  .toprow { display:flex; align-items:center; gap:22px;

  .headline .accent { color:#a44908; text-shadow:0 0 42px rgba(164,73,8,.12); }

  .sub b { color:#0f3a52; font-weight:600; }
  .tags { margin-top:auto; display:flex; flex-wrap:wrap; gap:16px; padding-bottom:46px; max-width:820px; }
  .tag { font-family:ui-monospace, "SF Mono", Consolas, monospace; font-size:20px;
    letter-spacing:.14em; text-transform:uppercase; color:#0f3a52;

    background:rgba(164,73,8,.07); }

  .footer .site { color:#a44908; letter-spacing:.1em; }
