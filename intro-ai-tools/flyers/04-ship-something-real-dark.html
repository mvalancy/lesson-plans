  .toprow { display:flex; align-items:center; gap:22px;

  .sub b { color:#e9e7e2; font-weight:600; }
  .tags { margin-top:auto; display:flex; flex-wrap:wrap; gap:16px; padding-bottom:46px; max-width:820px; }
  .tag { font-family:ui-monospace, "SF Mono", Consolas, monospace; font-size:20px;

    font-size:19px; letter-spacing:.16em; text-transform:uppercase; color:#a6adb8; }
  .footer .site { color:#f2b13f; letter-spacing:.1em; }
