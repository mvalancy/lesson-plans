  .content { position:relative; z-index:2; }
  .kicker { display:flex; align-items:center; gap:18px; margin-bottom:34px;
    font-family:ui-monospace, "SF Mono", Consolas, monospace;
    font-size:20px; letter-spacing:.3em; color:#3d6579; text-transform:uppercase; }
  .dot { width:14px; height:14px; background:#a44908; box-shadow:0 0 16px rgba(164,73,8,.45); }
  .headline { font-weight:900; font-size:150px; line-height:1.0;

  .headline .accent { color:#a44908; text-shadow:0 0 40px rgba(164,73,8,.12); }
