<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1800px; height:700px; }
  body { background:#0e1013; color:#e9e7e2; overflow:hidden; position:relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; padding:0 110px; }
  .grid { position:absolute; inset:0; background-image:
      linear-gradient(rgba(233,231,226,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(233,231,226,.05) 1px, transparent 1px);
    background-size:88px 88px; }
  .bloom { position:absolute; inset:0;
    background:radial-gradient(760px 560px at 80% 25%, rgba(212,80,107,.33), transparent 70%); }
  .vignette { position:absolute; inset:0;
    background:radial-gradient(1900px 900px at 50% 45%, transparent 55%, rgba(0,0,0,.55)); }
  .watermark { position:absolute; right:-20px; bottom:-90px; z-index:0;
    font-family:ui-monospace, "SF Mono", Consolas, monospace;
    font-size:420px; font-weight:700; line-height:1; color:transparent;
    -webkit-text-stroke:2px rgba(233,231,226,.10); letter-spacing:-0.05em; }
  .content { position:relative; z-index:2; }
  .kicker { display:flex; align-items:center; gap:18px; margin-bottom:34px;
    font-family:ui-monospace, "SF Mono", Consolas, monospace;
    font-size:20px; letter-spacing:.3em; color:#a6adb8; text-transform:uppercase; }
  .dot { width:14px; height:14px; background:#d4506b; box-shadow:0 0 16px rgba(212,80,107,.8); }
  .headline { font-weight:900; font-size:150px; line-height:1.0;
    letter-spacing:-0.015em; }
  .headline .accent { color:#d4506b; text-shadow:0 0 40px rgba(212,80,107,.35); }
</style></head><body>
  <div class="grid"></div><div class="bloom"></div><div class="vignette"></div>
  <div class="watermark">03</div>
  <div class="content">
    <div class="kicker"><div class="dot"></div><span>Intro to AI Tools</span></div>
    <div class="headline">Spot the fake. <span class="accent">Every time.</span></div>
  </div>
</body></html>
