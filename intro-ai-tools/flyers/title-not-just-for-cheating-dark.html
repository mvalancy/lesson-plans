  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1800px; height:700px; }
  body { background:#0e1013; color:#e9e7e2; overflow:hidden; position:relative;

    display:flex; align-items:center; padding:0 110px; }
  .grid { position:absolute; inset:0; background-image:

  .bloom { position:absolute; inset:0;

    font-size:420px; font-weight:700; line-height:1; color:transparent;
    -webkit-text-stroke:2px rgba(233,231,226,.10); letter-spacing:-0.05em; }
  .net { position:absolute; right:10px; top:0; width:880px; height:700px; z-index:1; }
  .content { position:relative; z-index:2; }
  .kicker { display:flex; align-items:center; gap:18px; margin-bottom:34px;
    font-family:ui-monospace, "SF Mono", Consolas, monospace;
    font-size:20px; letter-spacing:.3em; color:#a6adb8; text-transform:uppercase; }
  .dot { width:14px; height:14px; background:#f2b13f; box-shadow:0 0 16px rgba(242,177,63,.8); }
  .headline { font-weight:900; font-size:130px; line-height:1.0;
    letter-spacing:-0.015em; }
  .headline .accent { color:#f2b13f; text-shadow:0 0 40px rgba(242,177,63,.35); }
